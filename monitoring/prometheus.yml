# Prometheus 抓取配置（本地原生运行：无 Docker 时直接用）
# 用法（ai-service 目录）：
#   prometheus.exe --config.file=monitoring/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-teaching-assistant

scrape_configs:
  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: ai-teaching-assistant
